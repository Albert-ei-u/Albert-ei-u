name: GitHub Profile Language Analytics

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch and Generate Language Chart
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          # 1. Fetch raw language data from GraphQL API
          curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" \
            -d '{"query": "query { viewer { repositories(first: 100, ownerAffiliations: OWNER, isFork: false) { nodes { languages(first: 10, orderBy: {field: SIZE, direction: DESC}) { edges { size node { name color } } } } } } }"}' \
            https://github.com > raw_data.json

          # 2. Compile percentages using built-in node script
          node -e "
          const fs = require('fs');
          try {
            const raw = JSON.parse(fs.readFileSync('raw_data.json', 'utf8'));
            const repos = raw.data.viewer.repositories.nodes;
            const langs = {};
            let totalSize = 0;

            repos.forEach(repo => {
              repo.languages.edges.forEach(edge => {
                const name = edge.node.name;
                const color = edge.node.color || '#858585';
                const size = edge.size;
                if (!langs[name]) langs[name] = { size: 0, color };
                langs[name].size += size;
                totalSize += size;
              });
            });

            if (totalSize === 0) {
              console.log('No language data found.');
              process.exit(0);
            }

            const sorted = Object.entries(langs)
              .sort((a, b) => b[1].size - a[1].size)
              .slice(0, 6);

            let svg = \`<svg xmlns='http://w3.org' width='350' height='180' viewBox='0 0 350 180'>
              <rect width='100%' height='100%' rx='10' fill='#0d1117' stroke='#30363d' stroke-width='1'/>
              <text x='20' y='30' font-family='Segoe UI, Ubuntu, sans-serif' font-weight='600' font-size='16' fill='#58a6ff'>Most Used Languages</text>\`;

            let y = 60;
            sorted.forEach(([name, data]) => {
              const pct = ((data.size / totalSize) * 100).toFixed(1);
              svg += \`
                <circle cx='30' cy='\${y-5}' r='6' fill='\${data.color}'/>
                <text x='45' y='\${y}' font-family='Segoe UI, Ubuntu, sans-serif' font-size='14' fill='#c9d1d9'>\${name}</text>
                <rect x='140' y='\${y-10}' width='120' height='8' rx='4' fill='#161b22'/>
                <rect x='140' y='\${y-10}' width='\${1.2 * pct}' height='8' rx='4' fill='\${data.color}'/>
                <text x='275' y='\${y}' font-family='Segoe UI, Ubuntu, sans-serif' font-size='12' fill='#8b949e'>\${pct}%</text>\`;
              y += 22;
            });

            svg += '</svg>';
            fs.writeFileSync('languages.svg', svg);
          } catch (err) {
            console.error('Execution failed:', err);
            process.exit(1);
          }
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add languages.svg
          git diff-index --quiet HEAD || git commit -m "Update language statistics chart"
          git push
