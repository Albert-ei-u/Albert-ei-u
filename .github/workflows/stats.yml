name: GitHub Profile Language Analytics

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write # This fixes the failure by allowing the bot to save the card

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch and Generate Language Chart
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          # 1. Fetch raw language data from GraphQL API
          curl -s -X POST -H "Authorization: Bearer $GITHUB_TOKEN" \
            -d '{"query": "query { viewer { repositories(first: 100, ownerAffiliations: OWNER, isFork: false) { nodes { languages(first: 10, orderBy: {field: SIZE, direction: DESC}) { edges { size node { name color } } } } } } }"}' \
            https://github.com > raw_data.json

          # 2. Compile percentages and design the exact layout look
          node -e "
          const fs = require('fs');
          try {
            const raw = JSON.parse(fs.readFileSync('raw_data.json', 'utf8'));
            const repos = raw.data.viewer.repositories.nodes;
            const langs = {};
            let totalSize = 0;

            repos.forEach(repo => {
              repo.languages.edges.forEach(edge => {
                const name = edge.node.name;
                const color = edge.node.color || '#858585';
                const size = edge.size;
                if (!langs[name]) langs[name] = { size: 0, color };
                langs[name].size += size;
                totalSize += size;
              });
            });

            if (totalSize === 0) {
              console.log('No language data found.');
              process.exit(0);
            }

            const sorted = Object.entries(langs)
              .sort((a, b) => b.size - a.size)
              .slice(0, 6);

            // Start building the SVG card matching your image layout
            let svg = \`<svg xmlns='http://w3.org' width='450' height='160' viewBox='0 0 450 160'>
              <rect width='100%' height='100%' rx='6' fill='#0d1117' stroke='#30363d' stroke-width='1'/>
              <text x='25' y='35' font-family='Segoe UI, Ubuntu, sans-serif' font-weight='600' font-size='16' fill='#58a6ff'>Most Used Languages</text>\`;

            // Draw the top horizontal progress bar
            let currentX = 25;
            const barWidth = 400;
            sorted.forEach(([name, data]) => {
              const pct = data.size / totalSize;
              const w = pct * barWidth;
              if (w > 0.5) {
                svg += \`<rect x='\${currentX}' y='55' width='\${w}' height='10' fill='\${data.color}'/>\`;
                currentX += w;
              }
            });

            // Draw the two-column grid items underneath
            let itemX = 25;
            let itemY = 95;
            sorted.forEach(([name, data], index) => {
              const pct = ((data.size / totalSize) * 100).toFixed(2);
              
              if (index === 3) {
                itemX = 230; // Move to the second column
                itemY = 95;
              }

              svg += \`
                <circle cx='\${itemX + 6}' cy='\${itemY - 5}' r='5' fill='\${data.color}'/>
                <text x='\${itemX + 20}' y='\${itemY}' font-family='Segoe UI, Ubuntu, sans-serif' font-size='13' font-weight='500' fill='#c9d1d9'>\${name}</text>
                <text x='\${itemX + 110}' y='\${itemY}' font-family='Segoe UI, Ubuntu, sans-serif' font-size='13' fill='#8b949e'>\${pct}%</text>\`;
              
              itemY += 25;
            });

            svg += '</svg>';
            fs.writeFileSync('languages.svg', svg);
          } catch (err) {
            console.error('Execution failed:', err);
            process.exit(1);
          }
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add languages.svg
          git diff-index --quiet HEAD || git commit -m "Update language statistics chart"
          git push
