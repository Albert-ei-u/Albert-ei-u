name: GitHub Profile Language Analytics

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: GitHub README Stat Master
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.STATS_TOKEN }}
          filename: languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 0 # 0 removes the limit entirely so all 14 languages show up
          plugin_languages_sections: most-used # Keeps it clean by focusing only on your main languages
          plugin_languages_details: percentage
