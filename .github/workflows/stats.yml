name: GitHub Profile Language Analytics

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Language Chart
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          python -c "
          import os, requests, json
          token = os.getenv('GITHUB_TOKEN')
          headers = {'Authorization': f'Bearer {token}'}
          
          # Query GitHub GraphQL API for all repositories (including private)
          query = '''
          query {
            viewer {
              repositories(first: 100, ownerAffiliations: OWNER, isFork: false) {
                nodes {
                  languages(first: 10, orderBy: {field: SIZE, direction: DESC}) {
                    edges {
                      size
                      node { name color }
                    }
                  }
                }
              }
            }
          }
          '''
          
          res = requests.post('https://github.com', json={'query': query}, headers=headers).json()
          
          # Aggregate language sizes
          langs = {}
          try:
              repos = res['data']['viewer']['repositories']['nodes']
              for repo in repos:
                  for edge in repo['languages']['edges']:
                      name = edge['node']['name']
                      color = edge['node']['color'] or '#858585'
                      langs[name] = langs.get(name, {'size': 0, 'color': color})
                      langs[name]['size'] += edge['size']
          except Exception as e:
              print('Error fetching data:', res)
              exit(1)
          
          total_size = sum(l['size'] for l in langs.values())
          if total_size == 0:
              print('No language data found.')
              exit(0)
          
          # Sort and get top languages
          sorted_langs = sorted(langs.items(), key=lambda x: x[1]['size'], reverse=True)[:6]
          
          # Build a clean SVG card
          svg = f'''<svg xmlns=\"http://w3.org\" width=\"350\" height=\"180\" viewBox=\"0 0 350 180\">
            <rect width=\"100%\" height=\"100%\" rx=\"10\" fill=\"#0d1117\" stroke=\"#30363d\" stroke-width=\"1\"/>
            <text x=\"20\" y=\"30\" font-family=\"Segoe UI, Ubuntu, sans-serif\" font-weight=\"600\" font-size=\"16\" fill=\"#58a6ff\">Most Used Languages</text>
          '''
          
          y = 60
          for name, data in sorted_langs:
              pct = (data['size'] / total_size) * 100
              svg += f'''
              <circle cx=\"30\" cy=\"{y-5}\" r=\"6\" fill=\"{data['color']}\"/>
              <text x=\"45\" y=\"{y}\" font-family=\"Segoe UI, Ubuntu, sans-serif\" font-size=\"14\" fill=\"#c9d1d9\">{name}</text>
              <rect x=\"140\" y=\"{y-10}\" width=\"120\" height=\"8\" rx=\"4\" fill=\"#161b22\"/>
              <rect x=\"140\" y=\"{y-10}\" width=\"{1.2 * pct}\" height=\"8\" rx=\"4\" fill=\"{data['color']}\"/>
              <text x=\"275\" y=\"{y}\" font-family=\"Segoe UI, Ubuntu, sans-serif\" font-size=\"12\" fill=\"#8b949e\">{pct:.1f}%</text>
              '''
              y += 22
          
          svg += '</svg>'
          with open('languages.svg', 'w') as f: f.write(svg)
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add languages.svg
          git diff-index --quiet HEAD || git commit -m "Update language statistics chart"
          git push
